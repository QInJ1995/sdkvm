name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: pack smoke
        run: npm pack --dry-run

  # 三平台的真实安装/切换链路。macOS 与 Linux 同走 symlink + rc 分支，
  # 仍分开跑：bundle 展开、tar、rc 探测在各平台的差异只有真机才暴露
  e2e:
    name: e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      SDKVM_QUIET: '1'
      SHELL: /bin/bash   # Linux/macOS runner 的 $SHELL 可能为空，固定为 bash 使 rc 探测确定
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build

      - name: install temurin 21
        run: node dist/index.js install 21

      - name: install corretto 17
        run: node dist/index.js install 17 --vendor corretto

      - name: ls shows both
        run: node dist/index.js ls

      - name: use corretto 17
        run: node dist/index.js use 17 --vendor corretto

      - name: junction + registry (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # current-java junction 必须指向 corretto javaHome 且 java.exe 可执行
          & "$env:USERPROFILE\.sdkvm\current-java\bin\java.exe" -version
          # Get-ItemProperty/.NET 读值会展开 REG_EXPAND_SZ；用 DoNotExpand 比较字面 %VAR% 引用
          $k=[Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment')
          $fmt=[Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames
          $reg=[string]$k.GetValue('JAVA_HOME','',$fmt)
          if ($reg -ne '%USERPROFILE%\.sdkvm\current-java') { throw "registry JAVA_HOME wrong: $reg" }
          if ($k.GetValueKind('JAVA_HOME') -ne [Microsoft.Win32.RegistryValueKind]::ExpandString) { throw 'JAVA_HOME is not REG_EXPAND_SZ' }
          $userPath=[string]$k.GetValue('Path','',$fmt)
          if ($userPath -notlike '*%JAVA_HOME%\bin*') { throw "user PATH missing %JAVA_HOME%\bin: $userPath" }

      - name: symlink + rc (unix)
        if: runner.os != 'Windows'
        run: |
          test -x "$HOME/.sdkvm/current-java/bin/java"
          "$HOME/.sdkvm/current-java/bin/java" -version
          # CLI 在 macOS+bash 下写 ~/.bash_profile（与 detectRcFile 一致），Linux 写 ~/.bashrc
          case "$(uname -s)" in
            Darwin) RC="$HOME/.bash_profile" ;;
            *) RC="$HOME/.bashrc" ;;
          esac
          grep -q 'sdkvm java init' "$RC"
          grep -q 'JAVA_HOME="$HOME/.sdkvm/current-java"' "$RC"

      - name: uninstall keeps other versions
        run: |
          node dist/index.js uninstall 17 --vendor corretto
          node dist/index.js ls

      - name: install node 22
        run: node dist/index.js node install 22

      - name: use node 22
        run: node dist/index.js node use 22

      - name: node current + rc (unix)
        if: runner.os != 'Windows'
        run: |
          test -x "$HOME/.sdkvm/current-node/bin/node"
          "$HOME/.sdkvm/current-node/bin/node" --version
          case "$(uname -s)" in
            Darwin) RC="$HOME/.bash_profile" ;;
            *) RC="$HOME/.bashrc" ;;
          esac
          grep -q 'sdkvm node init' "$RC"
          grep -q 'NODE_HOME="$HOME/.sdkvm/current-node"' "$RC"

      - name: node junction + registry (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # windows 归档没有 bin/：node.exe 在 current-node 根目录，PATH entry 为 %NODE_HOME%（无 \bin）
          & "$env:USERPROFILE\.sdkvm\current-node\node.exe" --version
          $k=[Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment')
          $fmt=[Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames
          $reg=[string]$k.GetValue('NODE_HOME','',$fmt)
          if ($reg -ne '%USERPROFILE%\.sdkvm\current-node') { throw "registry NODE_HOME wrong: $reg" }
          $userPath=[string]$k.GetValue('Path','',$fmt)
          if ($userPath -notlike '*%NODE_HOME%*') { throw "user PATH missing %NODE_HOME%: $userPath" }

      - name: nrm smoke (windows)
        if: runner.os == 'Windows'
        run: |
          node dist/index.js nrm current
          node dist/index.js nrm ls

      - name: install go 1.24
        if: runner.os != 'Windows'
        run: node dist/index.js go install 1.24

      - name: install go 1.24 (windows, annotated)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set +e
          out=$(node dist/index.js go install 1.24 2>&1); code=$?
          echo "$out"
          if [ $code -ne 0 ]; then
            echo "::error title=go-install-windows::$(echo "$out" | tail -12 | tr '\n' '|')"
            exit 1
          fi

      - name: use go 1.24
        run: node dist/index.js go use 1.24

      - name: go current + binary (unix)
        if: runner.os != 'Windows'
        run: |
          test -x "$HOME/.sdkvm/current-go/bin/go"
          "$HOME/.sdkvm/current-go/bin/go" version
          case "$(uname -s)" in
            Darwin) RC="$HOME/.bash_profile" ;;
            *) RC="$HOME/.bashrc" ;;
          esac
          grep -q 'sdkvm go init' "$RC"
          grep -q 'GO_HOME="$HOME/.sdkvm/current-go"' "$RC"

      - name: go junction + registry (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:USERPROFILE\.sdkvm\current-go\bin\go.exe" version
          $k=[Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment')
          $fmt=[Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames
          $reg=[string]$k.GetValue('GO_HOME','',$fmt)
          if ($reg -ne '%USERPROFILE%\.sdkvm\current-go') { throw "registry GO_HOME wrong: $reg" }
          if ($k.GetValueKind('GO_HOME') -ne [Microsoft.Win32.RegistryValueKind]::ExpandString) { throw 'GO_HOME is not REG_EXPAND_SZ' }
          $userPath=[string]$k.GetValue('Path','',$fmt)
          if ($userPath -notlike '*%GO_HOME%\bin*') { throw "user PATH missing %GO_HOME%\bin: $userPath" }

      - name: go mirror smoke (config only)
        run: |
          node dist/index.js go mirror set golang https://golang.google.cn/dl
          node dist/index.js go mirror show

      - name: flutter resolve smoke (manifest only, no download)
        run: |
          node dist/index.js flutter ls -r
          node dist/index.js flutter mirror set flutter https://mirror.nju.edu.cn/flutter/flutter_infra_release
          node dist/index.js flutter mirror show

      - name: uninstall go
        run: node dist/index.js go uninstall 1.24

      - name: uninstall node
        run: node dist/index.js node uninstall 22

      - name: node mirror smoke (config only)
        run: |
          node dist/index.js node mirror set nodejs https://mirror.nju.edu.cn/nodejs-release
          node dist/index.js node mirror show

  # install.sh / install.ps1 的真实链路：本地起一个静态服务器冒充 GitHub Release
  # （npm pack 产物 + SHA256SUMS），Node 运行时仍从官方源下载。
  # 覆盖点：校验和、runtime 原子落位、shim 生成、PATH 写入（含 install.ps1 的
  # $HOME 只读变量回归——那次 bug 让 Windows PATH 从未写成功过）
  script-install:
    name: script install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      SHELL: /bin/bash   # 与 e2e job 同理：固定 bash 使 install.sh 的 rc 探测确定
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm pack
      - name: stage local release
        shell: bash
        run: |
          # 与 release.yml 的 checksums 步骤完全同款：两行哈希（版本名 + sdkvm.tgz）
          tgz=$(ls sdkvm-*.tgz)
          cp "$tgz" sdkvm.tgz
          sha256sum "$tgz" sdkvm.tgz > SHA256SUMS
          mkdir -p srv/releases/latest/download
          cp sdkvm.tgz SHA256SUMS srv/releases/latest/download/
      - name: serve release (unix)
        if: runner.os != 'Windows'
        run: |
          cd srv
          nohup python3 -m http.server 8099 >/dev/null 2>&1 &
          sleep 1
          curl -fsS http://127.0.0.1:8099/releases/latest/download/SHA256SUMS -o /dev/null
      - name: serve release (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Start-Process -FilePath python -ArgumentList '-m','http.server','8099','--directory','srv' -WindowStyle Hidden
          Start-Sleep -Seconds 2
          Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8099/releases/latest/download/SHA256SUMS -OutFile NUL

      - name: run install.sh
        if: runner.os != 'Windows'
        env:
          SDKVM_RELEASE_BASE: http://127.0.0.1:8099/releases
          SDKVM_HOME: ${{ github.workspace }}/.sdkvm-script
        run: sh install.sh
      - name: install.sh result (unix)
        if: runner.os != 'Windows'
        run: |
          test -x .sdkvm-script/bin/sdkvm
          .sdkvm-script/bin/sdkvm --version
          grep -q 'sdkvm path' "$HOME/.bashrc"

      - name: run install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SDKVM_RELEASE_BASE: http://127.0.0.1:8099/releases
          SDKVM_HOME: ${{ github.workspace }}\.sdkvm-script
        run: ./install.ps1
      - name: install.ps1 result (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SDKVM_HOME: ${{ github.workspace }}\.sdkvm-script
        run: |
          & "$env:SDKVM_HOME\bin\sdkvm.cmd" --version
          if (-not (Test-Path "$env:SDKVM_HOME\runtime\current\node.exe")) { throw 'runtime node missing' }
          # PATH 写入回归：SDKVM_HOME 在 USERPROFILE 之外时写绝对路径（历史上
          # $HOME 只读变量的 bug 让这一步从未成功执行过）
          $k=[Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment')
          $fmt=[Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames
          $userPath=[string]$k.GetValue('Path','',$fmt)
          if ($userPath -notlike "*$env:SDKVM_HOME\bin*") { throw "user PATH missing bin: $userPath" }
