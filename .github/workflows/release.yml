name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: pack and upload release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm pack
      - name: checksums
        run: |
          tgz=$(ls sdkvm-*.tgz)
          cp "$tgz" sdkvm.tgz
          sha256sum "$tgz" sdkvm.tgz > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            sdkvm-*.tgz
            sdkvm.tgz
            SHA256SUMS
          generate_release_notes: true
