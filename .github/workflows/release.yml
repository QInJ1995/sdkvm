name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: pack and upload release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - name: tag matches package version
        run: |
          # tag 与 package.json 不一致时直接失败：发布出去的 sdkvm.tgz 会带错误版本号，
          # 且 upgrade 的 same-version 短路会让用户永远升不上去
          v="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$v" != "$pkg" ]; then
            echo "::error title=version-mismatch::tag $GITHUB_REF_NAME -> $v but package.json is $pkg" >&2
            exit 1
          fi
      - run: npm test
      - run: npm pack
      - name: checksums
        run: |
          tgz=$(ls sdkvm-*.tgz)
          cp "$tgz" sdkvm.tgz
          sha256sum "$tgz" sdkvm.tgz > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            sdkvm-*.tgz
            sdkvm.tgz
            SHA256SUMS
          generate_release_notes: true
